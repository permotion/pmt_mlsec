site_name: PMT MLSec
site_description: ML-based security attack detection system
site_author: Permotion

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Brief: brief.md
  - Datasets: datasets.md
  - EDA: eda.md
  - Model A:
    - Overview: model_a/index.md
    - Baseline: model_a/baseline.md
    - v1 — Feature analysis: model_a/v1.md
    - v2 — URL features: model_a/v2.md
    - v3 — Content POST + MLflow: model_a/v3.md
    - v4 — URL structure GET: model_a/v4.md
    - v5 — Threshold calibration: model_a/v5.md
    - v6 — content_param_density: model_a/v6.md
    - v7 — Latin-1 encoding: model_a/v7.md
    - Hyperparameter tuning: model_a_hyperparameter_tuning.md
    - Post-training analysis: model_a_analysis.md
  - Model B:
    - Current status: model_b/index.md
  - Experiments (conventions): experiments.md
  - MLflow:
    - Setup and conventions: mlflow.md
    - Model Registry: model_registry.md
    - Runs: mlflow_runs.md
  - Airflow: airflow.md
  - API: api.md
  - MLOps + AIOps + Blue Team: mlops_aiops_blue_team.md
  - End-to-end flow: flux_end_to_end.md
  - RACI: raci_model_lifecycle.md
  - Red Team:
    - Guide: red_team/index.md
    - Technical: red_team_agent.md
  - Blue Team:
    - Guide: blue_team/index.md
  - Glossary: glossary.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/permotion

dev_addr: "0.0.0.0:8001"
